<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- See index.html for the BASE_PATH explanation. -->
    <base href="{{env "BASE_PATH"}}">
    <script>
        // The placeholder is substituted by the server when the app is served
        // under a prefix. When it is not, it stays literal: with nested double
        // quotes that was invalid JavaScript and the script stopped here.
        (function () {
            var raw = '{{env "BASE_PATH"}}';
            window.IZS_BASE_PATH = raw.indexOf('{{') === 0 ? '' : raw.replace(/\/$/, '');
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Login — Cohesive LLM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 380px;
        }
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo img { max-width: 140px; }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1e3a8a;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.35rem;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            margin-bottom: 1rem;
            transition: border-color 0.15s;
        }
        input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30,64,175,0.15);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        button:hover { background: #1e3a8a; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .error.visible { display: block; }

        /* Language picker. This page carries its own <style> and does not load
           style.css, so the rules are repeated here — and made specific enough
           to beat the generic `button { width: 100% }` above. On a dark ground
           the pill is translucent white rather than institutional blue. */
        .login-stack { display: flex; flex-direction: column; align-items: stretch; }
        .login-lang { display: flex; justify-content: flex-end; margin-bottom: 12px; }

        .login-links {
            margin-top: 1.25rem; padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
            text-align: center; font-size: 0.8rem; color: #9ca3af;
        }
        .login-links a { color: #6b7280; text-decoration: none; }
        .login-links a:hover { color: #1e40af; text-decoration: underline; }
        .login-links .sep { margin: 0 8px; color: #d1d5db; }
        .lang-picker { position: relative; }
        .login-lang .lang-current {
            display: inline-flex; align-items: center; gap: 7px;
            width: auto; padding: 6px 13px; margin: 0;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 20px;
            font-family: inherit; font-size: 12px; font-weight: 500;
            color: #fff; cursor: pointer; transition: background .2s ease;
        }
        .login-lang .lang-current:hover { background: rgba(255,255,255,0.24); }
        .login-lang .lang-chev { transition: transform .2s ease; opacity: .75; }
        .login-lang .lang-picker.open .lang-chev { transform: rotate(180deg); }

        .login-lang .lang-menu {
            display: none; position: absolute; top: calc(100% + 6px); right: 0;
            min-width: 172px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 10px; box-shadow: 0 10px 28px rgba(15,23,42,.28);
            padding: 4px;
        }
        .login-lang .lang-picker.open .lang-menu { display: block; }
        .login-lang .lang-option {
            display: flex; align-items: center; gap: 8px;
            width: 100%; margin: 0; padding: 8px 10px;
            background: transparent; border: none; border-radius: 7px;
            font-family: inherit; font-size: 13px; font-weight: 400;
            color: #2b3440; cursor: pointer; text-align: left;
        }
        .login-lang .lang-option:hover { background: #e6f2f8; }
        .login-lang .lang-option .lang-name { flex: 1; }
        .login-lang .lang-option .lang-iso {
            font-size: 10px; font-weight: 600; color: #919399; letter-spacing: .4px;
        }
        .login-lang .lang-check { color: #00679c; opacity: 0; }
        .login-lang .lang-option.active .lang-check { opacity: 1; }
        .login-lang .lang-option.active .lang-name { font-weight: 600; color: #00679c; }
    </style>
</head>
<body>
    <div class="login-stack">
        <div class="login-lang" id="loginLang"></div>
        <div class="card">
        <div class="logo">
            <img src="logo-izs-blue.jpg" alt="IZS">
        </div>
        <h1>Cohesive LLM</h1>
        <div id="error" class="error"></div>
        <form id="loginForm">
            <label for="username" data-i18n="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label for="password" data-i18n="password">Password</label>
            <div style="position:relative;">
                <input type="password" id="password" name="password" autocomplete="current-password" required style="padding-right:2.5rem;">
                <button type="button" id="togglePwd" style="position:absolute; right:8px; top:50%; transform:translateY(-70%); width:auto; padding:4px 8px; background:transparent; color:#9ca3af; font-size:1rem; cursor:pointer; border:none;" title="Show password">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <button type="submit" id="submitBtn" data-i18n="sign_in">Sign in</button>
        </form>

        <div class="login-links">
            <a href="#" id="forgotLink" data-i18n="forgot_password">Forgot your password?</a>
            <span class="sep">·</span>
            <a href="#" id="helpLink" data-i18n="need_help">Need help?</a>
        </div>
    </div>
    </div>

    <script type="module">
        import { applyTranslations, mountLanguagePicker } from './js/i18n.js?v=29';
        applyTranslations();
        mountLanguagePicker(document.getElementById('loginLang'));
    </script>

    <script>
        const BASE = window.IZS_BASE_PATH || '';
        const API_BASE = (window.location.port === '9000' || window.location.port === '3000' || window.location.port === '5500') ? 'http://localhost:8080' : (BASE || '');
        const APP_HOME = BASE + '/';

        // Placeholders: password recovery is not wired to anything yet. They
        // say so rather than silently doing nothing, which reads as broken.
        for (const [id, msg] of [
            ['forgotLink', 'Password recovery is not enabled on this instance. Ask the platform administrator to reset it.'],
            ['helpLink',   'For help with the platform, contact bioinformatica@izs.it.'],
        ]) {
            const el = document.getElementById(id);
            if (el) el.addEventListener('click', (e) => {
                e.preventDefault();
                const box = document.getElementById('error');
                box.textContent = msg;
                box.style.display = 'block';
                box.style.background = '#f1f5f9';
                box.style.color = '#475569';
                box.style.borderColor = '#cbd5e1';
            });
        }

        document.getElementById('togglePwd').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                pwd.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        });

        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('visible');
        }
        function clearError() {
            errorBox.textContent = '';
            errorBox.classList.remove('visible');
        }

        // If already authenticated, skip login. cache:no-store avoids the
        // browser reusing a stale 401 from a previous visit.
        fetch(API_BASE + '/auth/me', { credentials: 'same-origin', cache: 'no-store' })
            .then(r => { if (r.ok) window.location.href = APP_HOME; })
            .catch(() => {});

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    showError(data.detail || 'Invalid credentials');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign in';
                    return;
                }
                window.location.href = APP_HOME;
            } catch (err) {
                showError('Network error: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
